<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Mind Reader</title>
<style>
  body { font-family: system-ui, sans-serif; padding: 1rem; max-width: 32rem; margin: 0 auto; }
  .picker { margin-bottom: 1rem; }
  .picker-section { margin-bottom: 0.75rem; }
  .picker-section label { display: block; font-size: 0.85rem; color: #666; margin-bottom: 0.35rem; }
  .rank-cards { display: flex; flex-direction: column; gap: 0.35rem; }
  .rank-row { display: flex; gap: 0.35rem; flex-wrap: wrap; }
  .suit-cards { display: flex; gap: 0.35rem; flex-wrap: wrap; }
  .rank-card, .suit-card { width: 2.5rem; height: 3rem; border: 1px solid #ccc; border-radius: 4px; display: flex; align-items: center; justify-content: center; font-size: 1rem; background: #fff; cursor: pointer; user-select: none; }
  .rank-card:hover, .suit-card:hover { border-color: #666; background: #f8f8f8; }
  .rank-card.selected, .suit-card.selected { border-color: #1a4d6d; border-width: 2px; background: #e8f4fc; }
  .suit-card.red { color: #c00; }
  .suit-card { font-size: 1.25rem; }
  .add-row { margin-top: 0.75rem; }
  .cards-row { display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; margin: 1rem 0; }
  .pile { display: flex; gap: 0.5rem; flex-wrap: wrap; min-height: 5.5rem; }
  .card-slot { width: 4rem; height: 5.5rem; border: 1px solid #ccc; border-radius: 6px; display: flex; align-items: center; justify-content: center; gap: 0.25rem; font-size: 1.25rem; background: #fff; }
  .card-slot.empty { background: #f0f0f0; color: #999; font-size: 0.9rem; }
  .card-slot.red { color: #c00; }
  .card-back { width: 4rem; height: 5.5rem; border: 2px solid #1a4d6d; border-radius: 6px; background: linear-gradient(135deg, #1a4d6d 0%, #2d6a8f 100%); cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0.25rem; padding: 0.25rem; box-sizing: border-box; }
  .card-back:hover { opacity: 0.95; transform: scale(1.02); }
  .card-back.clickable { animation: pulse-border 1.5s ease-in-out infinite; }
  .card-back.clickable .click-hint { font-size: 0.55rem; color: rgba(255,255,255,0.95); text-align: center; line-height: 1.2; text-transform: uppercase; }
  @keyframes pulse-border { 0%, 100% { box-shadow: 0 0 0 0 rgba(26, 77, 109, 0.5); } 50% { box-shadow: 0 0 0 6px rgba(26, 77, 109, 0.2); } }
  .card-back.revealed { background: #fff; cursor: default; font-size: 1.25rem; flex-direction: row; }
  .card-back.revealed.red { color: #c00; }
  #add-btn { padding: 0.4rem 0.75rem; font-size: 1rem; cursor: pointer; }
  #add-btn:disabled { cursor: not-allowed; opacity: 0.6; }
</style>
<script>
var pile = [];
var revealed = null;
var selectedRank = 2;
var selectedSuit = "c";

function addToPile() {
  if (pile.length >= 4) return;
  pile.push({ r: selectedRank, s: selectedSuit });
  renderPile();
  document.getElementById("add-btn").disabled = pile.length >= 4;
  if (pile.length === 4) {
    var el = document.getElementById("fifth-card");
    el.classList.remove("revealed");
    el.classList.add("clickable");
    el.innerHTML = '<span class="click-hint">Click to reveal</span>';
    el.onclick = revealFifth;
    el.title = "Click to reveal your hidden card";
  }
}

function setRank(r) {
  selectedRank = r;
  document.querySelectorAll(".rank-card").forEach(function (el) {
    el.classList.toggle("selected", parseInt(el.getAttribute("data-rank"), 10) === r);
  });
}

function setSuit(s) {
  selectedSuit = s;
  document.querySelectorAll(".suit-card").forEach(function (el) {
    el.classList.toggle("selected", el.getAttribute("data-suit") === s);
  });
}

function suitChar(s) {
  if (s === "c") return "\u2663";
  if (s === "h") return "\u2665";
  if (s === "s") return "\u2660";
  if (s === "d") return "\u2666";
  return "";
}

function renderRankCards() {
  var numberRanks = [2, 3, 4, 5, 6, 7, 8, 9, 10];
  var faceRanks = [11, 12, 13, 14];
  var container = document.getElementById("rank-cards");
  container.innerHTML = "";
  function addRow(ranks) {
    var row = document.createElement("div");
    row.className = "rank-row";
    ranks.forEach(function (r) {
      var card = document.createElement("div");
      card.className = "rank-card" + (r === selectedRank ? " selected" : "");
      card.setAttribute("data-rank", r);
      card.textContent = rankToShort(r);
      card.onclick = function () { setRank(r); };
      row.appendChild(card);
    });
    container.appendChild(row);
  }
  addRow(numberRanks);
  addRow(faceRanks);
}

function renderSuitCards() {
  var suits = [
    { s: "c", red: false },
    { s: "h", red: true },
    { s: "s", red: false },
    { s: "d", red: true }
  ];
  var container = document.getElementById("suit-cards");
  container.innerHTML = "";
  suits.forEach(function (su) {
    var card = document.createElement("div");
    card.className = "suit-card" + (su.red ? " red" : "") + (su.s === selectedSuit ? " selected" : "");
    card.setAttribute("data-suit", su.s);
    card.textContent = suitChar(su.s);
    card.onclick = function () { setSuit(su.s); };
    container.appendChild(card);
  });
}

function renderPile() {
  var container = document.getElementById("pile");
  container.innerHTML = "";
  for (var i = 0; i < 4; i++) {
    var slot = document.createElement("div");
    slot.className = "card-slot";
    if (i < pile.length) {
      var c = pile[i];
      slot.textContent = rankToShort(c.r) + " " + suitChar(c.s);
      if (c.s === "h" || c.s === "d") slot.classList.add("red");
    } else {
      slot.classList.add("empty");
      slot.textContent = "—";
    }
    container.appendChild(slot);
  }
}

function rankToShort(r) {
  if (r <= 10) return r;
  if (r === 11) return "J";
  if (r === 12) return "Q";
  if (r === 13) return "K";
  if (r === 14) return "A";
  return r;
}

function revealFifth() {
  if (pile.length !== 4 || revealed) return;
  var r1 = pile[0].r, s1 = pile[0].s;
  var r2 = pile[1].r, s2 = pile[1].s;
  var r3 = pile[2].r, s3 = pile[2].s;
  var r4 = pile[3].r, s4 = pile[3].s;
  var result = computeHiddenCard(r1, s1, r2, s2, r3, s3, r4, s4);
  revealed = { r: result.r5, s: result.s5 };
  var el = document.getElementById("fifth-card");
  el.classList.add("revealed");
  el.classList.remove("clickable");
  el.onclick = null;
  el.textContent = rankToShort(revealed.r) + " " + suitChar(revealed.s);
  if (revealed.s === "h" || revealed.s === "d") el.classList.add("red");
}

function computeHiddenCard(r1, s1, r2, s2, r3, s3, r4, s4) {
  var s5 = s1;
  var offset = orderOf(r2, s2, r3, s3, r4, s4);
  var r5 = offset + r1;
  if (r5 >= 15) r5 = r5 - 13;
  return { r5: r5, s5: s5 };
}

function orderOf(r2, s2, r3, s3, r4, s4) {
  if (compare(r2, s2, r3, s3)) {
    if (compare(r2, s2, r4, s4)) {
      if (compare(r3, s3, r4, s4)) return 6;
      return 5;
    }
    return 3;
  }
  if (compare(r3, s3, r4, s4)) {
    if (compare(r2, s2, r4, s4)) return 4;
    return 2;
  }
  return 1;
}

function compare(r1, s1, r2, s2) {
  if (r1 > r2) return 1;
  if (r2 > r1) return 0;
  if (s2n(s1) > s2n(s2)) return 1;
  return 0;
}

function s2n(s) {
  if (s === "c") return 1;
  if (s === "h") return 2;
  if (s === "s") return 3;
  if (s === "d") return 4;
  return 0;
}
</script>
</head>
<body>
<h1>AI Mind Reader</h1>
<p>Pick a rank and a suit, then add each of your four cards to the pile.</p>

<div class="picker">
  <div class="picker-section">
    <label>Rank</label>
    <div class="rank-cards" id="rank-cards"></div>
  </div>
  <div class="picker-section">
    <label>Suit</label>
    <div class="suit-cards" id="suit-cards"></div>
  </div>
  <div class="add-row">
    <button type="button" id="add-btn" onclick="addToPile()">Add to the pile</button>
  </div>
</div>

<p>Your cards:</p>
<div class="cards-row">
  <div id="pile" class="pile"></div>
  <div id="fifth-card" class="card-back" title="Add 4 cards first"></div>
</div>

<script>
renderRankCards();
renderSuitCards();
renderPile();
</script>
</body>
</html>
